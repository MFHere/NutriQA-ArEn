[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nutriqa-dataset-tools"
version = "0.1.0"
description = "Command-line tools for normalizing the NutriQA dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ijson>=3.3",
    "numpy>=1.26",
    "openai>=2.0.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "rich>=13.9",
    "tiktoken>=0.8",
    "typer>=0.12",
    "usearch>=2.16",
]

[project.scripts]
nutriqa = "nutriqa_dataset.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nutriqa_dataset"]
